[project]
name = "dominoez"
version = "0.1.0"
description = "3D-printable toppling dominoes with engraved motifs"
requires-python = ">=3.11"
dependencies = [
    "shapely>=2.1",
    "trimesh>=4.6",
    "manifold3d>=3.0",
    "numpy>=2.0",
    "cairosvg>=2.7",
    "mapbox-earcut>=1.0",  # polygon triangulation for trimesh extrusions
]

[project.scripts]
dominoez = "dominoez.cli:main"

[dependency-groups]
dev = ["pytest>=8", "rtree>=1.3"]  # rtree: trimesh needs it for point containment in tests

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dominoez"]

[tool.pytest.ini_options]
testpaths = ["tests"]
