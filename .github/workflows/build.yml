name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest
      - run: uv run dominoez build
      - name: committed outputs match the code
        run: |
          git add -N stl svg png
          git diff --exit-code --stat -- stl svg png
