name: build

on:
  push:
  pull_request:

jobs:
  build:
    # Pinned so the apt prusa-slicer version, and therefore the committed gcode, stays stable.
    runs-on: ubuntu-24.04
    outputs:
      motifs: ${{ steps.motifs.outputs.motifs }}
      plates: ${{ steps.plates.outputs.plates }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: install PrusaSlicer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq prusa-slicer
          prusa-slicer --help | head -1
      - run: uv sync --locked
      - run: uv run pytest
      - run: uv run dominoez build
      - run: uv run dominoez slice
      - run: uv run dominoez plate
      - run: uv run reel build
      - run: uv run reel plate
      - name: committed outputs match the code
        run: |
          git add -N stl svg png gcode reel/stl
          git diff --exit-code --stat -- stl svg png gcode reel/stl
      - id: motifs
        run: echo "motifs=$(uv run dominoez list | cut -f1 | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"
      - name: all gcode, for the per-motif fan-out below
        uses: actions/upload-artifact@v4
        with:
          name: gcode-all
          path: gcode/*.gcode
          if-no-files-found: error
      - name: reel test-fit plate gcode
        uses: actions/upload-artifact@v4
        with:
          name: reel-test_fit.gcode
          path: reel/plate/test_fit.gcode
          if-no-files-found: error
      - name: reel full plate gcode
        uses: actions/upload-artifact@v4
        with:
          name: reel-full.gcode
          path: reel/plate/full.gcode
          if-no-files-found: error
      - id: plates
        run: echo "plates=$(ls plates/*.txt | xargs -n1 basename | sed 's/\.txt$//' | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"
      - name: all plate gcode, for the per-plate fan-out below
        uses: actions/upload-artifact@v4
        with:
          name: plates-gcode
          path: plate/*.gcode
          if-no-files-found: error

  gcode:
    # One artifact per motif, named after it, so a download is <motif>.gcode.zip holding <motif>.gcode.
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        motif: ${{ fromJson(needs.build.outputs.motifs) }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gcode-all
          path: gcode
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.motif }}.gcode
          path: gcode/${{ matrix.motif }}.gcode
          if-no-files-found: error

  plate:
    # One artifact per plate file, so a download is plate-<name>.gcode.zip holding <name>.gcode.
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        plate: ${{ fromJson(needs.build.outputs.plates) }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: plates-gcode
          path: plate
      - uses: actions/upload-artifact@v4
        with:
          name: plate-${{ matrix.plate }}.gcode
          path: plate/${{ matrix.plate }}.gcode
          if-no-files-found: error
